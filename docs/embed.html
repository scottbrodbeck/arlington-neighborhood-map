<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Arlington Map — ARLnow</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    #map { position: absolute; inset: 0; }
    #badge {
      position: absolute;
      left: 6px;
      top: 6px;
      z-index: 5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      color: #36365e;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 4px;
      padding: 2px 6px;
      text-decoration: none;
    }
    #badge:hover { text-decoration: underline; }
    .maplibregl-popup-content {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      padding: 8px 12px;
    }
    .pin-popup .pin-label { font-weight: 600; color: #1d1d3a; }
    .pin-popup .pin-hood { color: #555; font-size: 12px; margin-top: 2px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <a id="badge" href="https://map.arlnow.com/" target="_blank" rel="noopener">map.arlnow.com</a>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script type="module" src="embed.js"></script>
</body>
</html>
